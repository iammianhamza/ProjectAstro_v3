name: Build AstroROM

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device Codename'
        required: true
        default: 'x1q'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free disk space (1/4) - System Junk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/4) - Tool Cache
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Free disk space (3/4)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Free disk space (4/4)
        run: |
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/sbt
          sudo apt-get clean

      - name: Disk Space Check
        run: df -h /

      - name: Run AstroROM Build
        run: |
          sudo bash build.sh --build ${{ inputs.device }}

      - name: Extract ROM Contents
        run: |
          cd out
          ROM_FILE=$(find . -maxdepth 1 -name '*_signed.zip' -print | head -n 1 | sed 's|^\./||')
          
          if [ -z "$ROM_FILE" ]; then
            echo "No signed ROM zip found!"
            exit 1
          fi
          
          echo "Found ROM: $ROM_FILE"
          
          # Create extraction directory
          EXTRACT_DIR="${ROM_FILE%.zip}_extracted"
          mkdir -p "$EXTRACT_DIR"
          
          # Extract the ROM contents
          echo "Extracting ROM contents to $EXTRACT_DIR..."
          unzip -q "$ROM_FILE" -d "$EXTRACT_DIR"
          
          echo "ROM contents extracted successfully!"
          echo "Contents:"
          ls -lh "$EXTRACT_DIR"
          
      - name: Upload ROM ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroROM-${{ inputs.device }}-zip
          path: out/*_signed.zip
          retention-days: 30
          
      - name: Upload Extracted ROM Contents as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroROM-${{ inputs.device }}-extracted
          path: out/*_extracted/
          retention-days: 30
